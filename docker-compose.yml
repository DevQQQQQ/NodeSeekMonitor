services:
  nodeseek-monitor:
    build: .
    image: nodeseek-monitor
    container_name: nodeseek-monitor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data      # SQLite 持久化，容器重启不丢数据
    logging:
      driver: json-file
      options:
        max-size: "10m"       # 常驻服务，限制单文件大小避免日志无限增长
        max-file: "3"
    # 不需要暴露端口：这是一个后台 Worker，无 Web 服务
